nameOverride: ""
fullnameOverride: ""

namespaceOverride: ""

replicaCount: 1

image:
  # Default image registry is GHCR. Docker Hub is also published:
  # docker.io/sinanakyazici/consul-change-logger
  repository: ghcr.io/sinanakyazici/consul-change-logger
  tag: latest
  pullPolicy: IfNotPresent

bootstrap:
  # Existing Consul HTTP UI/API endpoint reachable from the Consul Change Logger pod.
  consulUpstreamUrl: "http://consul-server.consul.svc.cluster.local:8500"
  # Consul KV key that contains the runtime JSON document.
  consulConfigKey: "consul-change-logger/appsettings.json"
  # Set false only for trusted non-production environments.
  authentication: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

container:
  port: 8080

podSecurityContext:
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

outbox:
  mountPath: /var/lib/consul-change-logger/outbox
  pvc:
    enabled: true
    name: consul-change-logger-outbox
    # Leave empty to use the cluster default storage class.
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 5Gi
