# Add this container and volumeMount to the existing Consul UI pod template.
# Route the Consul UI Service/Ingress to port 8080 so all UI/API traffic passes through this sidecar.
securityContext:
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch

containers:
  - name: consul-change-logger
    image: your-registry/consul-change-logger:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1654
      runAsGroup: 1654
      capabilities:
        drop:
          - ALL
    ports:
      - name: logger-http
        containerPort: 8080
    volumeMounts:
      - name: change-log-outbox
        mountPath: /var/lib/consul-change-logger/outbox
    readinessProbe:
      httpGet:
        path: /health/ready
        port: logger-http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
    startupProbe:
      httpGet:
        path: /health/live
        port: logger-http
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 75
    livenessProbe:
      httpGet:
        path: /health/live
        port: logger-http
      periodSeconds: 30
      timeoutSeconds: 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

volumes:
  - name: change-log-outbox
    persistentVolumeClaim:
      claimName: consul-change-logger-outbox
