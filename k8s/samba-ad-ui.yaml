apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba-ad-ui
  namespace: samba-ad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba-ad-ui
  template:
    metadata:
      labels:
        app: samba-ad-ui
    spec:
      containers:
        - name: phpldapadmin
          image: osixia/phpldapadmin:0.9.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PHPLDAPADMIN_LDAP_HOSTS
              value: samba-ad
            - name: PHPLDAPADMIN_HTTPS
              value: "false"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: samba-ad-ui
  namespace: samba-ad
spec:
  type: LoadBalancer
  selector:
    app: samba-ad-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
