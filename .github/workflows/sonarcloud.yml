name: SonarCloud

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  quality-gate:
    name: SonarCloud quality gate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-${{ github.event.workflow_run.head_sha }}
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Begin SonarCloud analysis
        run: >
          dotnet sonarscanner begin
          /k:"sinanakyazici_ConsulChangeLogger"
          /o:"sinanakyazici"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.qualitygate.wait=true
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Authentication/AuthenticationEndpoints.cs,**/Authentication/LdapAuthenticator.cs,**/Authentication/LoginCsrfTokenStore.cs,**/Authentication/LoginPage.cs,**/Authentication/UserSession.cs,**/Authentication/UserSessionStore.cs,**/ChangeLogging/ChangeRecordDispatchWorker.cs,**/ChangeLogging/ChangeRecordOutbox.cs,**/ChangeLogging/ChangeRecordSink.cs,**/Core/ChangeRecord.cs,**/Core/ConsulKvChangeHelpers.cs,**/Core/ReadCache.cs,**/Configuration/ApplicationVersion.cs,**/Configuration/ConfigurationValidationException.cs,**/Configuration/ConfigurationValidator.cs,**/Configuration/ConsulConfigLoader.cs,**/Health/*.cs,**/Proxying/*.cs,**/Security/SecurityHeadersMiddleware.cs"
          /d:sonar.exclusions="k8s/appsettings.consul.example.json"
          /d:sonar.issue.ignore.multicriteria="e1,e2"
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S4830"
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/HttpClientConfigurator.cs"
          /d:sonar.issue.ignore.multicriteria.e2.ruleKey="kubernetes:S5332"
          /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/chart/consul-change-logger/values.yaml"

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test ConsulChangeLogger.slnx
          --configuration Release
          --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=TestResults/coverage.opencover.xml

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Upload source artifact for CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ github.event.workflow_run.head_sha }}
          path: |
            .github
            chart
            config
            docs
            k8s
            src
            tests
            .dockerignore
            .editorconfig
            .gitattributes
            .gitignore
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            ConsulChangeLogger.slnx
            CONTRIBUTING.md
            docker-compose.yml
            LICENSE
            README.md
            SECURITY.md
            !.sonarqube/**
            !src/**/bin/**
            !src/**/obj/**
            !tests/**/bin/**
            !tests/**/obj/**
          include-hidden-files: true
          if-no-files-found: error
