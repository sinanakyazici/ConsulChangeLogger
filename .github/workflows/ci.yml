name: CI-main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build-test-docker:
    name: Build, test, chart validation, and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ConsulChangeLogger.slnx --configuration Release --no-build

      - name: Helm lint
        run: helm lint chart/consul-change-logger

      - name: Helm template
        run: helm template consul-change-logger chart/consul-change-logger

      - name: Docker build
        run: docker build -f src/ConsulChangeLogger.Proxy/Dockerfile --build-arg APP_VERSION=ci-${{ github.sha }} -t consul-change-logger:ci .

      - name: Docker Scout vulnerability gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: consul-change-logger:ci
          exit-code: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Begin SonarCloud analysis
        run: >
          dotnet sonarscanner begin
          /k:"sinanakyazici_ConsulChangeLogger"
          /o:"sinanakyazici"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ConsulChangeLogger.slnx --configuration Release --no-build

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
