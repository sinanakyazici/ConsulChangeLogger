name: CI-main

on:
  workflow_run:
    workflows:
      - SonarCloud
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  build-test-docker:
    name: Build, test, chart validation, Docker build, and release bundle
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-${{ github.event.workflow_run.head_sha }}
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Detect semantic version tag
        id: release
        shell: bash
        run: |
          TAG="$(git ls-remote --tags "https://github.com/${{ github.repository }}.git" | awk -v sha="${{ github.event.workflow_run.head_sha }}" '$1 == sha { sub("refs/tags/", "", $2); print $2 }' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [[ -z "$TAG" ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version_label=ci-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_label=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/sinanakyazici/consul-change-logger" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ConsulChangeLogger.slnx --configuration Release --no-build

      - name: Helm lint
        run: helm lint chart/consul-change-logger

      - name: Helm template
        run: helm template consul-change-logger chart/consul-change-logger

      - name: Docker build
        run: docker build -f src/ConsulChangeLogger.Proxy/Dockerfile --build-arg APP_VERSION=${{ steps.release.outputs.version_label }} -t consul-change-logger:ci .

      - name: Docker Scout vulnerability gate
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3
        with:
          command: cves
          image: consul-change-logger:ci
          exit-code: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare release bundle
        if: steps.release.outputs.is_release == 'true'
        shell: bash
        run: |
          mkdir -p dist
          docker tag consul-change-logger:ci "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}"
          docker tag consul-change-logger:ci "${{ steps.release.outputs.image }}:latest"
          docker save \
            --output dist/consul-change-logger-image.tar \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.image }}:latest"
          helm package chart/consul-change-logger \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.version }}" \
            --destination dist

      - name: Upload release bundle
        if: steps.release.outputs.is_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle-${{ steps.release.outputs.version }}
          path: dist/*
          if-no-files-found: error
