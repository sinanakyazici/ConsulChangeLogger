name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-docker:
    name: Build, test, and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --configuration Release --project tests/ConsulChangeLogger.Tests/ConsulChangeLogger.Tests.csproj --no-build

      - name: Docker build
        run: docker build -f src/ConsulChangeLogger.Proxy/Dockerfile -t consul-change-logger:ci .
