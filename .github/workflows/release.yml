name: Release-publish

on:
  workflow_run:
    workflows:
      - CI-main
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  detect-release:
    name: Detect tagged CI run
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      image: ${{ steps.detect.outputs.image }}
      chart: ${{ steps.detect.outputs.chart }}
      dockerhub_image: ${{ steps.detect.outputs.dockerhub_image }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect semantic version tag
        id: detect
        shell: bash
        run: |
          TAG="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [[ -z "$TAG" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG#v}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/sinanakyazici/consul-change-logger" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=sinanakyazici/consul-change-logger" >> "$GITHUB_OUTPUT"
          echo "chart=oci://ghcr.io/sinanakyazici/charts" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release artifacts
    needs:
      - detect-release
    if: github.event.workflow_run.event == 'push' && needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Download CI release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle-${{ needs.detect-release.outputs.version }}
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push container image
        shell: bash
        run: |
          docker load -i dist/consul-change-logger-image.tar
          docker push "${{ needs.detect-release.outputs.image }}:${{ needs.detect-release.outputs.tag }}"
          docker push "${{ needs.detect-release.outputs.image }}:latest"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push container image to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        shell: bash
        run: |
          docker tag "${{ needs.detect-release.outputs.image }}:${{ needs.detect-release.outputs.tag }}" "${{ needs.detect-release.outputs.dockerhub_image }}:${{ needs.detect-release.outputs.tag }}"
          docker tag "${{ needs.detect-release.outputs.image }}:latest" "${{ needs.detect-release.outputs.dockerhub_image }}:latest"
          docker push "${{ needs.detect-release.outputs.dockerhub_image }}:${{ needs.detect-release.outputs.tag }}"
          docker push "${{ needs.detect-release.outputs.dockerhub_image }}:latest"

      - name: Helm registry login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push Helm chart to GHCR OCI
        shell: bash
        run: |
          helm push "dist/consul-change-logger-${{ needs.detect-release.outputs.version }}.tgz" "${{ needs.detect-release.outputs.chart }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.detect-release.outputs.tag }}
          name: ${{ needs.detect-release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/consul-change-logger-${{ needs.detect-release.outputs.version }}.tgz
