name: CodeQL

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL security gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          output: codeql-results

      - name: Fail if CodeQL produced findings
        shell: bash
        run: |
          mapfile -d '' sarif_files < <(find codeql-results -name '*.sarif' -print0)
          if [ "${#sarif_files[@]}" -eq 0 ]; then
            echo "No CodeQL SARIF file was produced. Failing CI."
            exit 1
          fi

          result_count="$(jq -s '[.[].runs[]?.results[]?] | length' "${sarif_files[@]}")"

          echo "CodeQL findings: ${result_count}"
          if [ "${result_count}" -gt 0 ]; then
            echo "CodeQL found ${result_count} issue(s). Failing CI."
            exit 1
          fi
