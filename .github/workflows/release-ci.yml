name: CI-release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-test-package:
    name: Build, test, package chart, and bundle image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Derive release metadata
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/sinanakyazici/consul-change-logger"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ConsulChangeLogger.slnx

      - name: Build
        run: dotnet build ConsulChangeLogger.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ConsulChangeLogger.slnx --configuration Release --no-build

      - name: Helm lint
        run: helm lint chart/consul-change-logger

      - name: Helm template
        run: helm template consul-change-logger chart/consul-change-logger

      - name: Docker build
        run: docker build -f src/ConsulChangeLogger.Proxy/Dockerfile -t consul-change-logger:ci .

      - name: Prepare release bundle
        shell: bash
        run: |
          mkdir -p dist
          docker tag consul-change-logger:ci "${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}"
          docker tag consul-change-logger:ci "${{ steps.version.outputs.image }}:latest"
          docker save \
            --output dist/consul-change-logger-image.tar \
            "${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.image }}:latest"
          helm package chart/consul-change-logger \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
